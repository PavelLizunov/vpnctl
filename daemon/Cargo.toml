[package]
name = "vpnctld"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "vpnctld"
path = "src/lib.rs"

[[bin]]
name = "vpnctld"
path = "src/main.rs"

[dependencies]
vpnctl-core = { path = "../crates/core" }
vpnctl-protocols = { path = "../crates/protocols" }
vpnctl-kernels = { path = "../crates/kernels" }
vpnctl-inventory = { path = "../crates/inventory" }
vpnctl-crypto = { path = "../crates/crypto" }
vpnctl-host-fingerprint = { path = "../crates/host-fingerprint" }
vpnctl-boosty-bridge = { path = "../crates/boosty-bridge" }
vpnctl-ssh = { path = "../crates/ssh", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
async-trait = "0.1"
thiserror = { workspace = true }

axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "matched-path", "query"] }
hyper = { version = "1", default-features = false, features = ["http1", "server"] }
hyper-util = { version = "0.1", default-features = false, features = ["http1", "server-graceful", "service", "tokio"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
tower = { version = "0.5", default-features = false }
argon2 = { version = "0.5", default-features = false, features = ["alloc", "password-hash"] }
tower-http = { version = "0.6", default-features = false, features = ["trace", "limit", "timeout", "fs", "set-header"] }
maud = { version = "0.27", features = ["axum"] }
base64 = "0.22"
percent-encoding = "2"
ipnet = "2"
subtle = "2"
hmac = { version = "0.12", default-features = false }
sha2 = { version = "0.10", default-features = false }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
anyhow = "1"
nix = { version = "0.31", default-features = false, features = ["signal", "process"] }
serde = { workspace = true }
serde_json = { workspace = true }
serde-saphyr = { workspace = true, features = ["serialize"] }
clap = { version = "4", features = ["derive", "env"] }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
chrono-tz = { version = "0.10", default-features = false }
tokio-stream = "0.1"
futures-core = "0.3"
maxminddb = { version = "0.27", optional = true }
tempfile = "3"

[features]
default = ["geoip"]
geoip = ["dep:maxminddb"]

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
serde-saphyr = { workspace = true, features = ["deserialize"] }
http-body-util = "0.1"
tokio = { version = "1", features = ["io-util", "macros", "rt-multi-thread"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
vpnctl-ssh = { path = "../crates/ssh" }
testcontainers = { version = "0.25", default-features = false }

[lints]
workspace = true
