[package]
name = "vpnctld"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "vpnctld"
path = "src/lib.rs"

[[bin]]
name = "vpnctld"
path = "src/main.rs"

[dependencies]
vpnctl-core = { path = "../crates/core" }
vpnctl-protocols = { path = "../crates/protocols" }
vpnctl-kernels = { path = "../crates/kernels" }
vpnctl-inventory = { path = "../crates/inventory" }

axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "matched-path"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tower = { version = "0.5", default-features = false }
tower-http = { version = "0.6", default-features = false, features = ["trace", "limit", "timeout"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
anyhow = "1"
serde = { workspace = true }
serde_json = { workspace = true }
clap = { version = "4", features = ["derive", "env"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
