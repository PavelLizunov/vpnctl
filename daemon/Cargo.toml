[package]
name = "vpnctld"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "vpnctld"
path = "src/lib.rs"

[[bin]]
name = "vpnctld"
path = "src/main.rs"

[dependencies]
vpnctl-core = { path = "../crates/core" }
vpnctl-protocols = { path = "../crates/protocols" }
vpnctl-kernels = { path = "../crates/kernels" }
vpnctl-inventory = { path = "../crates/inventory" }
# Phase C-3.2: web add-user form needs UUID + tuic-password generators.
vpnctl-crypto = { path = "../crates/crypto" }
# Single source of truth for ssh-keyscan + SHA256 fingerprint validation.
# Replaces three near-duplicate inline implementations (wizard_bootstrap +
# admin handler + cli set-fingerprint) that had drifted on the `--`
# flag-injection defense and on the validator alphabet.
vpnctl-host-fingerprint = { path = "../crates/host-fingerprint" }
# Track-3 chunk 1: clash-api client uses the SshTransport trait.
async-trait = "0.1"
thiserror = { workspace = true }
## NOTE: vpnctl-ssh (russh) is intentionally NOT a regular dep.
## It pulls glibc 2.38 syscalls; bookworm production host runs
## glibc 2.36. The poller + web-deploy reach VPN nodes via
## `crate::ssh_subprocess::SubprocessSshTransport` instead —
## wraps the system /usr/bin/ssh binary (no russh, no glibc bump).
## See `daemon/src/ssh_subprocess.rs` for the full rationale.
## vpnctl-ssh stays in [dev-dependencies] for the MockTransport
## used by unit tests (mocks don't pull russh).

axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "matched-path", "query"] }
# NOTE: NO `process` feature here — `tokio::process::Command` pulls
# `pidfd_spawnp` (glibc 2.39) as a STRONG symbol. The subprocess SSH
# transport uses `std::process::Command` via `tokio::task::spawn_blocking`
# instead; gives us per-call latency that's invisible at our cadence
# (5-min polls, on-demand deploys) without the glibc bump.
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tower = { version = "0.5", default-features = false }
# Argon2id password hashing for basic-auth (security audit 2026-05-18).
# Operator can either set VPNCTLD_ADMIN_PASSWORD to a plain string
# (backward-compat; logs a warn) OR to a `$argon2id$...` hash string
# from `vpnctl admin hash-password ...`. Hash form is preferred —
# if the env file leaks (backup, grep history, etc) the secret stays
# protected.
argon2 = { version = "0.5", default-features = false, features = ["alloc", "password-hash"] }
tower-http = { version = "0.6", default-features = false, features = ["trace", "limit", "timeout", "fs", "set-header"] }
maud = { version = "0.27", features = ["axum"] }
base64 = "0.22"
# URL-encoding for the ninitux vpn-router compat endpoint
# (`handlers/vpn_router.rs`) — must match Python's
# `urllib.parse.quote(s, safe="")` set so the vless:// fragments are
# byte-identical to subscription-server's output.
percent-encoding = "2"
subtle = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
anyhow = "1"
serde = { workspace = true }
serde_json = { workspace = true }
clap = { version = "4", features = ["derive", "env"] }
# Inline-SVG QR codes for /admin/users/<id> share-links.
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
# Phase D audit timeline: date-grouping (Today/Yesterday/<date>) +
# CSV export filename stamp.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# Phase E sub-iter 4b — wizard SSE bootstrap. Spawns a tokio task
# that pushes `BootstrapEvent`s into a bounded mpsc channel; the
# `ReceiverStream` adapter turns the channel into a `Stream` for
# axum's `Sse::new`. Pure-Rust deps — no glibc bump for the
# SubprocessSshTransport path (see `daemon/src/ssh_subprocess.rs`).
tokio-stream = "0.1"
# `futures_core::Stream` is the trait `axum::response::sse::Sse::new`
# accepts. Already pulled transitively by axum; declaring it directly
# keeps `daemon/src/wizard_bootstrap.rs` honest about its imports.
futures-core = "0.3"
# Track-1.2 (migration 0019) — MaxMind GeoLite2 reader for
# enriching sub_access_log rows with country + ASN. Pure-Rust, no
# openssl-sys / native-tls (matches workspace invariants). Gated
# behind the `geoip` feature so builds without the .mmdb files
# stay light; runtime gracefully degrades to disabled-lookup when
# VPNCTLD_GEOIP_DIR is unset OR the DB files are missing.
maxminddb = { version = "0.24", optional = true }

[features]
# Default: GeoIP enabled (pure-Rust dep, no native code). Operators
# who want a strictly minimal binary can disable it with
# `--no-default-features` — `GeoLookup::open` then returns a stub
# that always answers None.
default = ["geoip"]
geoip = ["dep:maxminddb"]

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
# Used both in admin_smoke tests AND in ssh_subprocess unit tests
# (tempdir for deploy-key generation). The crate is already a dev-dep
# elsewhere in the workspace; keeping it here keeps the import local.
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
# Track-2 chunk 2 e2e test asserts ban TTL within ~24h tolerance.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# Tests still need vpnctl-ssh for MockTransport — independent of the
# `polling` feature (mocks don't pull russh).
vpnctl-ssh = { path = "../crates/ssh" }

[lints]
workspace = true
