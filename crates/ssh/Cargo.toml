[package]
name = "vpnctl-ssh"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
vpnctl-core = { path = "../core" }
async-trait = { workspace = true }

# Real SSH transport.
russh = "0.60"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "io-util"] }
tracing = "0.1"
# Wrap secrets so they don't leak through Debug, accidental println, or
# memory after drop.
zeroize = { version = "1", features = ["derive"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
# E2E tests against a real sshd in a container. Only built when running
# tests that exercise it; gated by `#[ignore]` so `cargo test` on machines
# without Docker stays green (CI has Docker by default).
testcontainers = { version = "0.25", default-features = false }
tempfile = "3"

[lints]
workspace = true
