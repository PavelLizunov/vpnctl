[package]
name = "vpnctl-ssh"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = ["russh"]
russh = ["dep:russh", "dep:zeroize"]

[dependencies]
vpnctl-core = { path = "../core" }
vpnctl-host-fingerprint = { path = "../host-fingerprint" }
async-trait = { workspace = true }
base64 = "0.22"
tempfile = "3"

russh = { version = "0.64", optional = true }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "io-util"] }
tracing = "0.1"
zeroize = { version = "1", features = ["derive"], optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
testcontainers = { version = "0.25", default-features = false }

[lints]
workspace = true
