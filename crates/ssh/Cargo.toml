[package]
name = "vpnctl-ssh"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = ["russh"]
russh = ["dep:russh", "dep:zeroize"]

[dependencies]
vpnctl-core = { path = "../core" }
vpnctl-host-fingerprint = { path = "../host-fingerprint" }
async-trait = { workspace = true }
base64 = "0.22"
tempfile = "3"

# Real SSH transport.
russh = { version = "0.60", optional = true }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "io-util"] }
tracing = "0.1"
# Wrap secrets so they don't leak through Debug, accidental println, or
# memory after drop.
zeroize = { version = "1", features = ["derive"], optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
# E2E tests against a real sshd in a container. Only built when running
# tests that exercise it; gated by `#[ignore]` so `cargo test` on machines
# without Docker stays green (CI has Docker by default).
testcontainers = { version = "0.25", default-features = false }

[lints]
workspace = true
