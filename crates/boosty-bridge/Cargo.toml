[package]
name = "vpnctl-boosty-bridge"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
vpnctl-core = { path = "../core" }
vpnctl-crypto = { path = "../crypto" }
vpnctl-inventory = { path = "../inventory" }
boosty_api = { git = "https://github.com/PavelLizunov/boosty_api_rs", rev = "ee204ec" }
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = "0.1"
tokio = { version = "1", features = ["sync"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "sync"] }
tempfile = "3"
mockito = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
serde_json = { workspace = true }

[lints]
workspace = true
