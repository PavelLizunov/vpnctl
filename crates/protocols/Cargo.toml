[package]
name = "vpnctl-protocols"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
vpnctl-core = { path = "../core" }
serde_json = { workspace = true }
percent-encoding = "2"
# WireGuard share_link encodes the rendered .conf as base64url-no-pad
# inside a `wireguard://?conf=...` pseudo-URI for QR / paste import.
base64 = "0.22"
# AmneziaVPN deep-link (`vpn://<base64url(qCompress(json))>`) needs
# Qt-style qCompress: a 4-byte big-endian uncompressed-size prefix
# followed by a zlib stream. `rust_backend` picks the pure-Rust
# `miniz_oxide` deflate impl instead of the `zlib-ng-sys` or `libz-sys`
# C-backed alternatives — same hygiene rule as the rest of the
# workspace (CLAUDE.md forbids openssl-sys / native-tls; we extend
# that "no C shim" policy to optional features that have a pure-Rust
# alternative).
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

[lints]
workspace = true
