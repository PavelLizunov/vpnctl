[package]
name = "vpnctl-inventory"
version = "0.8.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
vpnctl-core = { path = "../core" }
vpnctl-crypto = { path = "../crypto" }
vpnctl-host-fingerprint = { path = "../host-fingerprint" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

# Persistent storage. sqlx with rustls (default-features=false avoids dragging
# in native-tls / openssl which deny.toml bans).
sqlx = { version = "0.8", default-features = false, features = [
    "sqlite",
    "runtime-tokio-rustls",
    "macros",
    "migrate",
    "chrono",
] }
chrono = { version = "0.4", default-features = false, features = ["serde", "clock"] }
# Phase 5c — restore self-test uses `NamedTempFile` to copy the
# snapshot to a per-call scratch path BEFORE running the migrator
# against it. Promoted from dev-dependencies (where it was used by
# the snapshot tests) to a real dep so the self-test code path can
# rely on RAII-style cleanup.
tempfile = "3"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde_json = { workspace = true }
chrono = { version = "0.4", default-features = false, features = ["serde", "clock"] }

[lints]
workspace = true
