name: Private checks release build
on:
  push:
    branches: [build/private-entry-662b411]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          ref: 662b411a8fc81601c1ef60a8e84af269a8b4badf
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache: false
      - run: sudo apt-get update && sudo apt-get install -y musl-tools cmake
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-musl-ubuntu24-baseline
      - name: Build checked revision
        env:
          VPNCTL_BUILD_SHA: 662b411
          RUSTFLAGS: '-C target-cpu=x86-64'
          CFLAGS_x86_64_unknown_linux_musl: '-march=x86-64 -mtune=generic'
          CXXFLAGS_x86_64_unknown_linux_musl: '-march=x86-64 -mtune=generic'
          GOAMD64: v1
        run: |
          test "$(git rev-parse HEAD)" = 662b411a8fc81601c1ef60a8e84af269a8b4badf
          cargo build --release --target x86_64-unknown-linux-musl -p vpnctld -p vpnctl
          mkdir -p release
          cp target/x86_64-unknown-linux-musl/release/{vpnctl,vpnctld} release/
          release/vpnctl --version | grep -F '0.9.0+662b411'
          for binary in vpnctl vpnctld; do
            headers=$(readelf -l "release/$binary")
            ! grep -q INTERP <<< "$headers"
          done
          OUT="$PWD/release/sing-box" tools/singbox-attr-patch/build.sh
          tools/singbox-stats-helper/build.sh "$PWD/release/singbox-stats-helper"
          cp scripts/deploy.sh release/
          cp -r daemon/assets release/assets
          printf '%s\n' "$(git rev-parse HEAD)" > release/REVISION
          (cd release && sha256sum vpnctl vpnctld sing-box singbox-stats-helper deploy.sh > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: vpnctl-private-662b411-linux-amd64
          path: release/
          retention-days: 3
