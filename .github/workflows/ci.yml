name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: cargo check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets

  fmt:
    name: cargo fmt --check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: cargo clippy -D warnings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: cargo test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-targets

  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  # NOTE: a separate `cargo audit` job was removed — the `deny` job above
  # already runs `cargo deny check advisories` against the same RustSec DB,
  # AND honours our deny.toml `[advisories].ignore` list. Having both meant
  # double-failing on RUSTSEC-2023-0071 (Marvin Attack on `rsa` via russh).

  # gitleaks — secret-scanner pre-merge gate (2026-05-18 security
  # audit recommendation #1). Catches accidental commits of
  # inventory/<IP>.env files, VPNCTLD_ADMIN_PASSWORD pastes in
  # docs, leaked bot tokens, etc.
  #
  # Default ruleset covers Telegram bot tokens, AWS, GitHub, generic
  # high-entropy strings. Repo-local allowlist in `.gitleaks.toml`
  # excludes intentional examples (e.g. test fixtures).
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # required for `gitleaks detect` to scan history
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  e2e:
    name: e2e (testcontainers — Docker required)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: pre-pull sshd image (cuts test latency, surfaces network errors here)
        run: docker pull lscr.io/linuxserver/openssh-server:latest
      - name: e2e_sshd
        run: cargo test -p vpnctl-ssh --test e2e_sshd -- --ignored --nocapture
      - name: spec_password_auth (independent test-writer-agent suite)
        run: cargo test -p vpnctl-ssh --test spec_password_auth -- --ignored --nocapture

  # cargo-mutants — mutation testing on the protocols crate's
  # byte-equality contract. Catches «tests pass even when impl is
  # inverted» bugs (the db3998c-style mistake). Promoted from
  # `just mutants-protocols` to CI per the 2026-05-18 audit
  # deferred-items list.
  #
  # Scoped to `vpnctl-protocols` only because:
  #   * That crate's `share_link` byte-equality regression tests are
  #     the highest-value mutation surface.
  #   * Whole-workspace mutants would push CI past 30 min.
  #   * `--in-diff origin/main` further narrows runtime on PRs by
  #     mutating only changed code paths.
  #
  # Soft-fail policy: a missed mutant produces a warning annotation
  # but does NOT block merge. Hardening to a blocking gate happens
  # once the surface is stable + the false-positive rate is known.
  # (continue-on-error: true.)
  mutants:
    name: cargo-mutants (protocols, soft-fail)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # `--in-diff origin/main` needs main reachable
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: install cargo-mutants
        run: cargo install --locked cargo-mutants --version ^25
      - name: run mutation tests on protocols crate
        run: |
          # The `|| true` belt-and-braces with continue-on-error:
          # cargo-mutants exits non-zero when any mutant survives,
          # which we want surfaced as an annotation, not a hard fail.
          cargo mutants -p vpnctl-protocols --in-diff origin/main \
            --timeout-multiplier 3 --no-shuffle || true
