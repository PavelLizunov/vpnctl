name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  check:
    name: cargo check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: project map is current
        run: python3 scripts/project-map.py --check
      - name: bundled CSS is current
        run: python3 scripts/bundle-css.py --check
      - name: cargo check
        run: |
          set +e
          cargo check --workspace --all-targets
          status=$?
          echo "cargo check --workspace --all-targets exit_code=$status"
          exit "$status"

  fmt:
    name: cargo fmt --check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: |
          set +e
          cargo fmt --all -- --check
          status=$?
          echo "cargo fmt --all -- --check exit_code=$status"
          exit "$status"

  clippy:
    name: cargo clippy -D warnings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: |
          set +e
          cargo clippy --workspace --all-targets -- -D warnings
          status=$?
          echo "cargo clippy --workspace --all-targets -- -D warnings exit_code=$status"
          exit "$status"

  test:
    name: cargo test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: backup script regression tests
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd sqlite3
          bash -n scripts/vpnctl-backup.sh scripts/tests/test_vpnctl_backup.sh
          bash scripts/tests/test_vpnctl_backup.sh
      - name: script and docs regression tests
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py' -v
      - run: |
          set +e
          cargo test --workspace --all-targets
          status=$?
          echo "cargo test --workspace --all-targets exit_code=$status"
          exit "$status"

      - name: load a trusted source catalog through the public daemon router
        env:
          VPNCTL_TEST_TRUSTED_SOURCE_CATALOG: /run/vpnctl-ci/source-catalog.json
        run: |
          sudo install -d -o root -g root -m 0755 /run/vpnctl-ci
          sudo install -o root -g root -m 0644 daemon/tests/fixtures/vpnrouter-source-catalog.json "$VPNCTL_TEST_TRUSTED_SOURCE_CATALOG"
          cargo test -p vpnctld --test spec_vpnrouter_source_diagnosis -- --ignored

  corp-portal-ui:
    name: Corp portal browser verification
    # Playwright 1.56.1 supports Ubuntu 24.04; ubuntu-latest can move ahead.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: configure temporary browser paths
        run: |
          echo "CORP_UI_OUTPUT_DIR=$RUNNER_TEMP/corp-ui-fixtures" >> "$GITHUB_ENV"
          echo "CORP_DIAGNOSTICS_UI_OUTPUT_DIR=$RUNNER_TEMP/corp-diagnostics-ui-fixtures" >> "$GITHUB_ENV"
          echo "CORP_OPERATOR_UI_OUTPUT_DIR=$RUNNER_TEMP/corp-operator-ui-fixtures" >> "$GITHUB_ENV"
          echo "CORP_UI_SCREENSHOT_DIR=$RUNNER_TEMP/corp-ui-screenshots" >> "$GITHUB_ENV"
          echo "CORP_UI_TOOLING_DIR=$RUNNER_TEMP/corp-ui-tooling" >> "$GITHUB_ENV"
      - name: export pages from real synthetic router tests
        run: cargo test -p vpnctld --test spec_corp_policy_http --test spec_corp_operator --test spec_corp_egress --test corp_diagnostics_ui_fixture
      - uses: actions/setup-node@v5
        with:
          node-version: '22.21.1'
      - name: install pinned browser tooling outside the checkout
        run: |
          npm install --prefix "$CORP_UI_TOOLING_DIR" --ignore-scripts --no-audit --no-fund --package-lock=false --save-exact @playwright/test@1.56.1
          "$CORP_UI_TOOLING_DIR/node_modules/.bin/playwright" install --with-deps chromium
      - name: verify interactions and narrow layouts without a server
        run: node scripts/corp-portal-ui.mjs
      - name: upload synthetic screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: corp-portal-ui-${{ github.sha }}
          path: ${{ env.CORP_UI_SCREENSHOT_DIR }}
          if-no-files-found: warn
          retention-days: 14

  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit@0.23.0
      - name: Verify inherited advisory coverage
        run: python3 -m unittest discover -s scripts/tests -p 'test_date_fork_advisories.py' -v
      - name: Audit upstream ancestry of maintained date forks
        run: python3 scripts/audit-date-forks.py --output "$RUNNER_TEMP/date-fork-audit.lock"
      - name: record successful deny gate
        run: echo 'cargo deny check exit_code=0 (cargo-deny action)'

  static-musl:
    name: static musl release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
        with:
          key: static-musl
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - name: musl build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools cmake
      - name: canonical release build
        env:
          VPNCTL_BUILD_SHA: ${{ github.sha }}
        run: just build-release
      - name: verify daemon and CLI have no dynamic interpreter
        run: |
          for binary in vpnctld vpnctl; do
            artifact="target/x86_64-unknown-linux-musl/release/$binary"
            test -x "$artifact"
            program_headers="$(readelf --program-headers "$artifact")"
            if [[ "$program_headers" == *INTERP* ]]; then
              echo "$binary unexpectedly requires a dynamic interpreter" >&2
              exit 1
            fi
          done
      - name: stage exact-source daemon delivery
        run: |
          delivery="$RUNNER_TEMP/vpnctl-daemon-delivery"
          mkdir -p "$delivery"
          cp target/x86_64-unknown-linux-musl/release/vpnctld target/x86_64-unknown-linux-musl/release/vpnctl "$delivery/"
          cp -a daemon/assets "$delivery/assets"
          printf '%s\n' "$GITHUB_SHA" > "$delivery/source-sha.txt"
          cd "$delivery"
          find . -type f ! -name SHA256SUMS -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: vpnctl-daemon-${{ github.sha }}
          path: ${{ runner.temp }}/vpnctl-daemon-delivery
          if-no-files-found: error
          retention-days: 7

  managed-node-artifacts:
    name: managed sing-box accounting artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache: false
      - name: test and verify stats helper dependencies
        working-directory: tools/singbox-stats-helper
        run: |
          go test -mod=readonly ./...
          go mod verify
      - name: build static stats helper
        run: tools/singbox-stats-helper/build.sh /tmp/singbox-stats-helper
      - name: build managed sing-box
        env:
          OUT: /tmp/sing-box
        run: tools/singbox-attr-patch/build.sh
      - name: verify managed features
        run: |
          /tmp/sing-box version | grep -q with_v2ray_api
          test -x /tmp/singbox-stats-helper
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: corp-managed-runtime
      - name: verify Corp probes with the managed runtime
        env:
          VPNCTL_CORP_TEST_SING_BOX: /tmp/sing-box
        run: cargo test -p vpnctld --test spec_corp_probe_runtime managed_ -- --ignored
      - name: stage exact-source node delivery
        run: |
          delivery="$RUNNER_TEMP/vpnctl-node-delivery"
          mkdir -p "$delivery"
          cp /tmp/sing-box /tmp/singbox-stats-helper "$delivery/"
          printf '%s\n' "$GITHUB_SHA" > "$delivery/source-sha.txt"
          cd "$delivery"
          sha256sum sing-box singbox-stats-helper source-sha.txt > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: vpnctl-node-${{ github.sha }}
          path: ${{ runner.temp }}/vpnctl-node-delivery
          if-no-files-found: error
          retention-days: 7


  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # required for `gitleaks detect` to scan history
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  e2e:
    name: e2e (testcontainers — Docker required)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: pre-pull sshd image (cuts test latency, surfaces network errors here)
        run: |
          for i in 1 2 3 4 5; do
            docker pull lscr.io/linuxserver/openssh-server:latest && exit 0
            sleep $((i * 20))
          done
          exit 1
      - name: e2e_sshd
        run: cargo test -p vpnctl-ssh --test e2e_sshd -- --ignored --nocapture
      - name: subprocess_ssh_e2e
        # The linuxserver image never finishes init for USER_NAME=root, so the
        # root round trip is skipped here; the sudo and host-key tests run.
        run: cargo test -p vpnctld --test subprocess_ssh_e2e -- --ignored --nocapture --skip subprocess_ssh_root_roundtrip
      - name: spec_password_auth (independent test-writer-agent suite)
        run: cargo test -p vpnctl-ssh --test spec_password_auth -- --ignored --nocapture

  mutants:
    name: cargo-mutants (protocols, soft-fail)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # `--in-diff origin/main` needs main reachable
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: install cargo-mutants
        run: cargo install --locked cargo-mutants --version ^25
      - name: run mutation tests on protocols crate
        run: |
          cargo mutants -p vpnctl-protocols --in-diff origin/main \
            --timeout-multiplier 3 --no-shuffle || true

  layout-check-smoke:
    name: layout-check (script smoke, soft-fail)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - name: parse + import-check
        run: |
          python3 -m py_compile scripts/layout_check.py
          python3 -c "
          import sys, ast
          src = open('scripts/layout_check.py').read()
          ast.parse(src)
          required = {'all_equal_width', 'all_equal_height', 'all_start_at_same_y', 'at_least_one'}
          tree = ast.parse(src)
          defs = {n.name for n in ast.walk(tree) if isinstance(n, ast.FunctionDef)}
          missing = required - defs
          if missing:
              print(f'MISSING: {missing}', file=sys.stderr)
              sys.exit(1)
          print(f'ok: all {len(required)} assertion helpers present')
          "

  controller-ha:
    name: Controller HA fault tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Isolated adapter contracts
        run: python3 -m unittest discover -s scripts/ha -p 'test_*.py'
      - name: Fetch pinned official Consul fixture
        run: |
          curl -fsSLo /tmp/consul.zip https://releases.hashicorp.com/consul/2.1.0/consul_2.1.0_linux_amd64.zip
          echo "a9c9cdf1ed93bd29a9671b02e5433131f3f777bab16c076fcef712a2820bfe33  /tmp/consul.zip" | sha256sum -c -
          unzip /tmp/consul.zip consul -d /tmp/ha-consul
          chmod +x /tmp/ha-consul/consul
      - name: Real three-voter and cgroup faults
        run: |
          sudo env VPNCTL_HA_CONSUL_BINARY=/tmp/ha-consul/consul VPNCTL_HA_SYSTEMD_TESTS=1 \
            python3 -m unittest discover -s scripts/ha -p test_isolated_cluster.py -v
          sudo env VPNCTL_HA_SYSTEMD_TESTS=1 \
            python3 -m unittest discover -s scripts/ha -p test_worker_sleep.py -v
