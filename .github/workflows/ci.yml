name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  check:
    name: cargo check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: project map is current
        run: python3 scripts/project-map.py --check
      - run: cargo check --workspace --all-targets

  fmt:
    name: cargo fmt --check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: cargo clippy -D warnings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: cargo test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: backup script regression tests
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd
          bash -n scripts/vpnctl-backup.sh scripts/tests/test_vpnctl_backup.sh
          bash scripts/tests/test_vpnctl_backup.sh
      - run: cargo test --workspace --all-targets

  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2

  managed-node-artifacts:
    name: managed sing-box accounting artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache: false
      - name: test and verify stats helper dependencies
        working-directory: tools/singbox-stats-helper
        run: |
          go test -mod=readonly ./...
          go mod verify
      - name: build static stats helper
        run: tools/singbox-stats-helper/build.sh /tmp/singbox-stats-helper
      - name: build managed sing-box
        env:
          OUT: /tmp/sing-box
        run: tools/singbox-attr-patch/build.sh
      - name: verify managed features
        run: |
          /tmp/sing-box version | grep -q with_v2ray_api
          test -x /tmp/singbox-stats-helper


  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # required for `gitleaks detect` to scan history
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  e2e:
    name: e2e (testcontainers — Docker required)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: pre-pull sshd image (cuts test latency, surfaces network errors here)
        run: |
          for i in 1 2 3 4 5; do
            docker pull lscr.io/linuxserver/openssh-server:latest && exit 0
            sleep $((i * 20))
          done
          exit 1
      - name: e2e_sshd
        run: cargo test -p vpnctl-ssh --test e2e_sshd -- --ignored --nocapture
      - name: subprocess_ssh_e2e
        # The linuxserver image never finishes init for USER_NAME=root, so the
        # root round trip is skipped here; the sudo and host-key tests run.
        run: cargo test -p vpnctld --test subprocess_ssh_e2e -- --ignored --nocapture --skip subprocess_ssh_root_roundtrip
      - name: spec_password_auth (independent test-writer-agent suite)
        run: cargo test -p vpnctl-ssh --test spec_password_auth -- --ignored --nocapture

  mutants:
    name: cargo-mutants (protocols, soft-fail)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # `--in-diff origin/main` needs main reachable
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: install cargo-mutants
        run: cargo install --locked cargo-mutants --version ^25
      - name: run mutation tests on protocols crate
        run: |
          cargo mutants -p vpnctl-protocols --in-diff origin/main \
            --timeout-multiplier 3 --no-shuffle || true

  layout-check-smoke:
    name: layout-check (script smoke, soft-fail)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - name: parse + import-check
        run: |
          python3 -m py_compile scripts/layout_check.py
          python3 -c "
          import sys, ast
          src = open('scripts/layout_check.py').read()
          ast.parse(src)
          required = {'all_equal_width', 'all_equal_height', 'all_start_at_same_y', 'at_least_one'}
          tree = ast.parse(src)
          defs = {n.name for n in ast.walk(tree) if isinstance(n, ast.FunctionDef)}
          missing = required - defs
          if missing:
              print(f'MISSING: {missing}', file=sys.stderr)
              sys.exit(1)
          print(f'ok: all {len(required)} assertion helpers present')
          "
