name: VPNRouter assistant gateway verification
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: d6128ad3a5e5530c2421e438df8d311299427734
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Check revision, inventory and formatting
        run: |
          test "$(git rev-parse HEAD)" = d6128ad3a5e5530c2421e438df8d311299427734
          python3 scripts/project-map.py --check
          cargo fmt --all -- --check
      - name: Exercise v1 planning and the new step contract
        run: cargo test --locked -p vpnctld --lib vpnrouter_assistant_spec_tests
