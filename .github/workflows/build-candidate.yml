name: Build candidate artifacts

on:
  pull_request:
    branches: [main]
    paths:
      - 'daemon/**'
      - 'cli/**'
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'tools/singbox-attr-patch/**'
      - 'tools/singbox-stats-helper/**'
      - 'scripts/deploy.sh'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: candidate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 2
  CARGO_INCREMENTAL: 0
  GOMAXPROCS: 2
  GOTOOLCHAIN: local
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  BUILD_TARGET: x86_64-unknown-linux-musl
  VPNCTL_BUILD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  candidate:
    # Fork code never runs in this artifact job. This workflow does not deploy;
    # the existing CI workflow remains the activation gate for the same SHA.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - name: Read-only hosted-runner preflight
        working-directory: ${{ runner.temp }}
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = Linux
          test "$RUNNER_ARCH" = X64
          python3 - <<'PY'
          import os
          import pathlib
          import shutil
          import subprocess

          cpus = os.cpu_count() or 1
          load = os.getloadavg()[0]
          memory = {
              key: int(value.split()[0])
              for key, value in (
                  line.split(":", 1)
                  for line in pathlib.Path("/proc/meminfo").read_text().splitlines()
              )
          }
          available_mib = memory["MemAvailable"] // 1024
          swap_used_mib = (memory["SwapTotal"] - memory["SwapFree"]) // 1024
          free_gib = shutil.disk_usage(os.environ["RUNNER_TEMP"]).free / 2**30
          builders = {"cargo", "rustc", "go", "cc1", "cc1plus", "clang", "ld", "make", "ninja", "cmake", "zig"}
          processes = subprocess.check_output(["ps", "-eo", "pid=,comm="], text=True)
          competing = [line.strip() for line in processes.splitlines() if line.split()[-1] in builders]
          print(f"CPUs={cpus}; load1={load:.2f}; maximum={cpus * 1.5:.2f}")
          print(f"available RAM={available_mib} MiB; minimum=4096 MiB")
          print(f"swap total={memory['SwapTotal'] // 1024} MiB; used={swap_used_mib} MiB; maximum=512 MiB")
          print(f"free disk={free_gib:.2f} GiB; minimum=12 GiB")
          print(f"competing build processes (PID/name): {competing}; maximum=0")
          if load > cpus * 1.5 or available_mib < 4096 or swap_used_mib > 512 or free_gib < 12 or competing:
              raise SystemExit("Runner capacity preflight failed; retry on an idle hosted runner")
          PY
          git --version
          python3 --version
          rustc --version || true
          cargo --version || true
          go version || true
          cc --version | head -n 1
          tar --version | head -n 1
          sha256sum --version | head -n 1

      - name: Check out exact candidate source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ env.VPNCTL_BUILD_SHA }}
          persist-credentials: false
          fetch-depth: 1

      - name: Verify source identity
        run: |
          [[ "$VPNCTL_BUILD_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$VPNCTL_BUILD_SHA"
          test -z "$(git status --porcelain)"
          printf 'Candidate source: %s\n' "$VPNCTL_BUILD_SHA"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version: '1.26.x'
          cache: false

      - name: Install musl tools on hosted runner
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools

      - name: Verify build toolchain
        run: |
          rustc --version
          cargo --version
          rustup target list --installed | grep -Fx "$BUILD_TARGET"
          go version | grep -E '^go version go1\.26\.'
          musl-gcc --version
          curl --version

      - name: Build daemon and CLI from the same revision
        run: cargo build --locked --release --target "$BUILD_TARGET" -p vpnctld -p vpnctl

      - name: Acquire pinned managed sing-box and build stats helper
        run: |
          mkdir -p target/node-artifacts
          OUT="$PWD/target/node-artifacts/sing-box" TARGET_ARCH=x86_64 FORCE_BUILD=0 \
            tools/singbox-attr-patch/build.sh
          tools/singbox-stats-helper/build.sh "$PWD/target/node-artifacts/singbox-stats-helper"
          (cd tools/singbox-stats-helper && go mod verify)
          target/node-artifacts/sing-box version | grep -q with_v2ray_api
          test -x target/node-artifacts/singbox-stats-helper

      - name: Verify binary provenance on isolated loopback inventory
        run: |
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import socket
          import subprocess
          import tempfile
          import time
          import tomllib
          import urllib.error
          import urllib.request

          root = pathlib.Path.cwd()
          release = root / "target" / os.environ["BUILD_TARGET"] / "release"
          version = tomllib.loads((root / "Cargo.toml").read_text())["workspace"]["package"]["version"]
          expected = f"{version}+{os.environ['VPNCTL_BUILD_SHA'][:7]}"
          cli_version = subprocess.check_output([release / "vpnctl", "--version"], text=True).strip()
          if cli_version != f"vpnctl {expected}":
              raise SystemExit(f"CLI provenance mismatch: {cli_version}")
          # vpnctld --version is semver-only; health exposes its compiled SHA.
          # All generated state stays outside the package and is removed here.
          with tempfile.TemporaryDirectory(prefix="candidate-smoke-", dir=os.environ["RUNNER_TEMP"]) as temporary:
              with socket.socket() as listener:
                  listener.bind(("127.0.0.1", 0))
                  port = listener.getsockname()[1]
              runtime_env = {
                  "PATH": os.environ["PATH"],
                  "HOME": temporary,
                  "XDG_DATA_HOME": temporary,
                  "VPNCTLD_DEPLOY_KEY": str(pathlib.Path(temporary) / "deploy-key"),
                  "VPNCTLD_BACKUP_DIR": str(pathlib.Path(temporary) / "backups"),
              }
              with open(pathlib.Path(temporary) / "daemon.log", "w") as log:
                  process = subprocess.Popen(
                      [release / "vpnctld", "--db", str(pathlib.Path(temporary) / "inventory.db"), "--addr", f"127.0.0.1:{port}"],
                      env=runtime_env, stdout=log, stderr=log,
                  )
                  try:
                      opener = urllib.request.build_opener(urllib.request.ProxyHandler({}))
                      deadline = time.monotonic() + 20
                      while True:
                          if process.poll() is not None:
                              raise SystemExit("Candidate daemon exited before its health check")
                          try:
                              with opener.open(f"http://127.0.0.1:{port}/api/v1/health", timeout=1) as response:
                                  health = json.load(response)
                              break
                          except (urllib.error.URLError, TimeoutError):
                              if time.monotonic() >= deadline:
                                  raise SystemExit("Candidate daemon health check timed out")
                              time.sleep(0.2)
                      if health != {"status": "ok", "version": version, "build": expected}:
                          raise SystemExit("Daemon health provenance does not match candidate source")
                  finally:
                      process.terminate()
                      try:
                          process.wait(timeout=5)
                      except subprocess.TimeoutExpired:
                          process.kill()
                          process.wait()
          print(f"Verified daemon and CLI build: {expected}")
          PY

      - name: Package binaries and source assets only
        id: package
        run: |
          test "$(git rev-parse HEAD)" = "$VPNCTL_BUILD_SHA"
          git diff --exit-code
          bundle="vpnctl-candidate-${VPNCTL_BUILD_SHA}-linux-amd64"
          staging="$RUNNER_TEMP/candidate-package/$bundle"
          output="$RUNNER_TEMP/candidate-output"
          mkdir -p "$staging/bin" "$output"
          install -m 0755 "target/$BUILD_TARGET/release/vpnctld" "$staging/bin/vpnctld"
          install -m 0755 "target/$BUILD_TARGET/release/vpnctl" "$staging/bin/vpnctl"
          install -m 0755 target/node-artifacts/sing-box "$staging/bin/sing-box"
          install -m 0755 target/node-artifacts/singbox-stats-helper "$staging/bin/singbox-stats-helper"
          git archive "$VPNCTL_BUILD_SHA" daemon/assets | tar -xf - --strip-components=1 -C "$staging"
          # Only tracked frontend asset types are permitted; reject symlinks,
          # configuration, inventory, environment and key files from this tree.
          test -z "$(find "$staging/assets" -mindepth 1 ! -type d ! -type f -print -quit)"
          test -z "$(find "$staging/assets" -type f ! \( -name '*.css' -o -name '*.js' -o -name '*.svg' -o -name '*.woff2' -o -name '*LICENSE.txt' \) -print -quit)"
          printf '%s\n' "$VPNCTL_BUILD_SHA" > "$staging/SOURCE_SHA"
          (
            cd "$staging"
            find bin assets SOURCE_SHA -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
            sha256sum --check SHA256SUMS
          )
          tar -czf "$output/$bundle.tar.gz" -C "$RUNNER_TEMP/candidate-package" "$bundle"
          (
            cd "$output"
            sha256sum "$bundle.tar.gz" > "$bundle.tar.gz.sha256"
            sha256sum --check "$bundle.tar.gz.sha256"
          )
          printf 'artifact_name=%s\n' "$bundle" >> "$GITHUB_OUTPUT"
          printf 'Candidate source: `%s`\n\nArchive: `%s.tar.gz`\n\nExisting CI on this SHA is still required before activation.\n' \
            "$VPNCTL_BUILD_SHA" "$bundle" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload reviewable candidate archive and digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: |
            ${{ runner.temp }}/candidate-output/${{ steps.package.outputs.artifact_name }}.tar.gz
            ${{ runner.temp }}/candidate-output/${{ steps.package.outputs.artifact_name }}.tar.gz.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
