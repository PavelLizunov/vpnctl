name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Locally-cached cargo dirs survive between runs on the same runner.
  CARGO_HOME: ${{ github.workspace }}/.cargo-home
  RUSTUP_HOME: ${{ github.workspace }}/.rustup-home

jobs:
  ci:
    name: check + fmt + clippy + test
    # Default Forgejo Actions runner image is `node:20-bookworm`.
    # Image must have curl + build-essential to install Rust toolchain.
    runs-on: docker
    container:
      image: rust:1.85-slim-bookworm
    steps:
      - uses: actions/checkout@v4

      - name: install build deps
        run: |
          apt-get update
          apt-get install -y --no-install-recommends pkg-config libssl-dev
          rustup component add rustfmt clippy

      - name: project map is current
        run: python3 scripts/project-map.py --check

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo check
        run: cargo check --workspace --all-targets

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace --all-targets
