[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/crypto",
    "crates/ssh",
    "crates/protocols",
    "crates/kernels",
    "crates/hosters",
    "crates/inventory",
    "cli",
]

[workspace.package]
edition = "2024"
license = "AGPL-3.0-or-later"
authors = ["slovn"]
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
async-trait = "0.1"
