[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/crypto",
    "crates/ssh",
    "crates/protocols",
    "crates/kernels",
    "crates/inventory",
    "crates/host-fingerprint",
    "crates/boosty-bridge",
    "cli",
    "daemon",
]

[workspace.package]
edition = "2024"
license = "AGPL-3.0-or-later"
authors = ["slovn"]
rust-version = "1.85"
# Self-hosted homelab tool; never published to crates.io. Setting this
# workspace-wide also lets cargo-deny's `allow-wildcard-paths` apply (it
# only kicks in for non-public crates, because crates.io rejects path
# deps in published packages).
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
async-trait = "0.1"

# Centralized lint config — applied to every member via `[lints] workspace = true`.
# Best practice as of Rust 1.74+, replaces per-crate `#![deny(...)]`.
[workspace.lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "warn"
dbg_macro = "deny"
print_stdout = "allow"  # CLI legitimately prints to stdout
print_stderr = "allow"
# Pedantic but useful:
clone_on_ref_ptr = "warn"
needless_pass_by_value = "warn"
