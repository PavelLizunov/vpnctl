[package]
name = "vpnctl"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "vpnctl"
path = "src/main.rs"

[dependencies]
vpnctl-core = { path = "../crates/core" }
vpnctl-protocols = { path = "../crates/protocols" }
vpnctl-kernels = { path = "../crates/kernels" }
vpnctl-hosters = { path = "../crates/hosters" }
vpnctl-inventory = { path = "../crates/inventory" }
vpnctl-crypto = { path = "../crates/crypto" }
vpnctl-ssh = { path = "../crates/ssh" }

clap = { version = "4", features = ["derive", "env"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs"] }
anyhow = "1"
serde = { workspace = true }
serde_json = { workspace = true }
dirs = "5"
comfy-table = "7"
qrcode = { version = "0.14", default-features = false }

[lints]
workspace = true
