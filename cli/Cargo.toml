[package]
name = "vpnctl"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[[bin]]
name = "vpnctl"
path = "src/main.rs"

[dependencies]
vpnctl-core = { path = "../crates/core" }
vpnctl-protocols = { path = "../crates/protocols" }
vpnctl-kernels = { path = "../crates/kernels" }
vpnctl-hosters = { path = "../crates/hosters" }
vpnctl-inventory = { path = "../crates/inventory" }
vpnctl-crypto = { path = "../crates/crypto" }
clap = { version = "4", features = ["derive", "env"] }

[lints]
workspace = true
