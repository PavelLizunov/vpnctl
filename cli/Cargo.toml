[package]
name = "vpnctl"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "vpnctl"
path = "src/main.rs"

[dependencies]
vpnctl-core = { path = "../crates/core" }
vpnctl-protocols = { path = "../crates/protocols" }
vpnctl-kernels = { path = "../crates/kernels" }
vpnctl-inventory = { path = "../crates/inventory" }
vpnctl-crypto = { path = "../crates/crypto" }
vpnctl-ssh = { path = "../crates/ssh", features = ["russh"] }
vpnctl-host-fingerprint = { path = "../crates/host-fingerprint" }
vpnctl-boosty-bridge = { path = "../crates/boosty-bridge" }

clap = { version = "4", features = ["derive", "env"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs"] }
anyhow = "1"
serde = { workspace = true }
serde_json = { workspace = true }
dirs = "5"
comfy-table = "7"
qrcode = { version = "0.14", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
flate2 = "1"
maxminddb = "0.27"
futures-util = "0.3"
argon2 = { version = "0.5", default-features = false, features = ["alloc", "password-hash", "std"] }
rand_core = { version = "0.6", features = ["std", "getrandom"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
