
[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    "RUSTSEC-2023-0071",
    "RUSTSEC-2025-0134", # rustls-pemfile unmaintained, transitively via bollard→testcontainers
    "RUSTSEC-2025-0111", # tokio-tar PAX header parsing — file-smuggling on untrusted tar reads;
]

[licenses]
version = 2
allow = [
    "AGPL-3.0-or-later",

    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MPL-2.0",
    "Zlib",
    "CC0-1.0",
    "Unlicense",
    "OpenSSL",                # legacy SSLeay text bundled inside `ring`
    "CDLA-Permissive-2.0",    # webpki-roots / Mozilla CA bundle
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
deny = [
    { name = "openssl" },
    { name = "openssl-sys" },
    { name = "native-tls" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = ["https://github.com/PavelLizunov/boosty_api_rs"]
