# cargo-deny configuration. Enforced in CI.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    # RUSTSEC-2023-0071 — Marvin Attack: timing side-channel in `rsa` crate.
    # Pulled transitively by russh. No patch upstream (as of 2026-05).
    # Mitigation: vpnctl uses Ed25519 SSH keys throughout (claude-chat key is
    # Ed25519). The RSA host-key auth path is unreachable in our control plane.
    # Network-side timing on a deploy CLI does not apply (we initiate, the
    # private key is on the client, and an attacker observing client-side
    # timings has already won bigger).
    "RUSTSEC-2023-0071",
    # The following two reach us only via `testcontainers` (dev-dep used in
    # the e2e_sshd test); they cannot affect the shipped binary.
    "RUSTSEC-2025-0134", # rustls-pemfile unmaintained, transitively via bollard→testcontainers
    "RUSTSEC-2025-0111", # tokio-tar PAX header parsing — file-smuggling on untrusted tar reads;
                        # we don't read tarballs in production, only testcontainers does.
]

[licenses]
version = 2
allow = [
    # Our own crates.
    "AGPL-3.0-or-later",

    # Permissive licenses we accept in transitive deps.
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MPL-2.0",
    "Zlib",
    "CC0-1.0",
    "Unlicense",
    "OpenSSL",                # legacy SSLeay text bundled inside `ring`
    "CDLA-Permissive-2.0",    # webpki-roots / Mozilla CA bundle
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Internal path-deps (`{ path = "../core" }`) have no version pin and look
# like wildcards; that's normal for a workspace.
allow-wildcard-paths = true
deny = [
    # banned: openssl-sys — мы не хотим тянуть system OpenSSL, всё через rustls / RustCrypto.
    { name = "openssl" },
    { name = "openssl-sys" },
    { name = "native-tls" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# The Boosty API client (rustls) lives in the operator's own fork; the
# boosty-bridge crate pins it by commit. Whitelisted so cargo-deny's
# unknown-git guard accepts it.
allow-git = ["https://github.com/PavelLizunov/boosty_api_rs"]
